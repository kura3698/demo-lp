<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="robots" content="noindex" />
    <title>demo-lp</title>
    <!-- OGP -->
    <meta property="og:title" content="demo-lp" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hogehoge.com/" />
    <meta property="og:description" content="demo-lp" />
    <meta property="og:image" content="https://hogehoge.com/" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="628" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="demo-lp" />
    <meta name="twitter:description" content="demo-lp" />
    <!-- google font-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Oswald:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="/css/style.css" />

        <script type="application/ld+json">

    <!-- <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js" defer></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

  </head>

  <body>
    <header class="l-header">
      <div class="l-header__inner">
        <a href="#top" class="l-header__logo">
          <img
            src="/img/logo.webp"
            alt="Mongolia Balloon Camp"
            width="114"
            height="50"
            decoding="async"
          />
        </a>

        <nav class="p-global-nav" aria-label="メインナビゲーション">
          <ul class="p-global-nav__list p-global-nav__list--left">
            <li class="p-global-nav__item">
              <a
                href="#top"
                class="p-global-nav__link p-global-nav__link--icon"
                aria-label="TOP"
              >
                <img
                  src="/img/icon_home.svg"
                  alt=""
                  class="p-global-nav__icon p-global-nav__icon--default"
                  width="20"
                  height="16"
                  decoding="async"
                />
                <img
                  src="/img/icon_home-hover.svg"
                  alt=""
                  class="p-global-nav__icon p-global-nav__icon--hover"
                  width="20"
                  height="16"
                  decoding="async"
                />
              </a>
            </li>
            <li class="p-global-nav__item">
              <a href="#activity" class="p-global-nav__link">アクティビティ</a>
            </li>
            <li class="p-global-nav__item">
              <a href="#about" class="p-global-nav__link">キャンプについて</a>
            </li>
          </ul>
          <ul class="p-global-nav__list p-global-nav__list--right">
            <li class="p-global-nav__item">
              <a href="#travel" class="p-global-nav__link">旅行例</a>
            </li>
            <li class="p-global-nav__item">
              <a href="#gallery" class="p-global-nav__link">フォトギャラリー</a>
            </li>
            <li class="p-global-nav__item">
              <a href="#blog" class="p-global-nav__link">ぼるふ〜草原記</a>
            </li>
          </ul>
        </nav>

        <button
          type="button"
          class="c-hamburger-icon"
          aria-expanded="false"
          aria-controls="global-drawer"
          aria-label="メニューを開く"
        >
          <span class="c-hamburger-icon__bar" aria-hidden="true"></span>
          <span class="c-hamburger-icon__bar" aria-hidden="true"></span>
          <span class="c-hamburger-icon__bar" aria-hidden="true"></span>
          <span class="c-hamburger-icon__label c-hamburger-icon__label--open"
            >MENU</span
          >
          <span class="c-hamburger-icon__label c-hamburger-icon__label--close"
            >CLOSE</span
          >
        </button>

        <nav
          id="global-drawer"
          class="c-drawer"
          aria-label="メニュー"
          aria-hidden="true"
        >
          <ul class="c-drawer__list">
            <li class="c-drawer__item">
              <a href="#top" class="c-drawer__link">TOP</a>
            </li>
            <li class="c-drawer__item">
              <a href="#activity" class="c-drawer__link">アクティビティ</a>
            </li>
            <li class="c-drawer__item">
              <a href="#about" class="c-drawer__link">キャンプについて</a>
            </li>
            <li class="c-drawer__item">
              <a href="#travel" class="c-drawer__link">旅行例</a>
            </li>
            <li class="c-drawer__item">
              <a href="#gallery" class="c-drawer__link">フォトギャラリー</a>
            </li>
            <li class="c-drawer__item">
              <a href="#blog" class="c-drawer__link">ぼるふ〜草原記</a>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <main id="main">
      <section class="p-fv" id="top" aria-label="ファーストビュー">
        <div class="swiper p-fv__slider">
          <div class="swiper-wrapper">
            <!-- スライド1 -->
            <div class="swiper-slide p-fv__slide">
              <picture class="p-fv__bg">
                <source
                  media="(min-width: 768px)"
                  srcset="/img/img_fv-1-pc@2x.webp"
                  width="1440"
                  height="700"
                />
                <img
                  src="/img/img_fv-1-sp@2x.webp"
                  alt=""
                  width="390"
                  height="580"
                  fetchpriority="high"
                  decoding="async"
                />
              </picture>
              <div class="p-fv__content">
                <h1 class="p-fv__heading">
                  <picture
                    class="p-fv__heading-picture p-fv__heading-picture--s1"
                  >
                    <source
                      media="(min-width: 768px)"
                      srcset="/img/img_fv-text1-pc@2x.webp"
                    />
                    <img
                      src="/img/img_fv-text1-sp@2x.webp"
                      alt="オープンから20年 伝統あるキャンプ場で最高のモンゴル旅を"
                      width="350"
                      height="130"
                      decoding="async"
                    />
                  </picture>
                </h1>
              </div>
            </div>

            <!-- スライド2 -->
            <div class="swiper-slide p-fv__slide">
              <picture class="p-fv__bg">
                <source
                  media="(min-width: 768px)"
                  srcset="/img/img_fv-2-pc@2x.webp"
                  width="1440"
                  height="700"
                />
                <img
                  src="/img/img_fv-2-sp@2x.webp"
                  alt=""
                  width="390"
                  height="580"
                  decoding="async"
                />
              </picture>
              <div class="p-fv__content">
                <p class="p-fv__heading">
                  <picture
                    class="p-fv__heading-picture p-fv__heading-picture--s2"
                  >
                    <source
                      media="(min-width: 768px)"
                      srcset="/img/img_fv-text2-pc@2x.webp"
                    />
                    <img
                      src="/img/img_fv-text2-sp@2x.webp"
                      alt="大草原を眺めながら空の散歩 モンゴルでここでしか出来ない体験を"
                      width="350"
                      height="130"
                      decoding="async"
                    />
                  </picture>
                </p>
              </div>
            </div>

            <!-- スライド3 -->
            <div class="swiper-slide p-fv__slide">
              <picture class="p-fv__bg">
                <source
                  media="(min-width: 768px)"
                  srcset="/img/img_fv-3-pc@2x.webp"
                  width="1440"
                  height="700"
                />
                <img
                  src="/img/img_fv-3-sp@2x.webp"
                  alt=""
                  width="390"
                  height="580"
                  decoding="async"
                />
              </picture>
              <div class="p-fv__content">
                <p class="p-fv__heading">
                  <picture
                    class="p-fv__heading-picture p-fv__heading-picture--s3"
                  >
                    <source
                      media="(min-width: 768px)"
                      srcset="/img/img_fv-text3-pc@2x.webp"
                    />
                    <img
                      src="/img/img_fv-text3-sp@2x.webp"
                      alt="360度大パノラマの草原で 息を呑むほど美しい満天の星空を"
                      width="350"
                      height="130"
                      decoding="async"
                    />
                  </picture>
                </p>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="/js/script.js"></script>
  </body>
</html>
